<!doctype html><html lang="en" class="scroll-smooth"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or 'MediTrack' }}</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#ecfdf5',600:'#059669',700:'#047857'},ink:'#111827'}}}}</script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"></head><body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"><div id="loader" class="loader hidden"><div></div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="fixed right-4 top-4 z-50 space-y-2">{% for category,message in messages %}<div class="toast {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block body %}{% endblock %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
