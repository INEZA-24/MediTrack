{% extends 'base.html' %}{% from 'partials.html' import logo %}{% block body %}<div class="grid min-h-screen place-items-center px-4"><div class="w-full max-w-md rounded-2xl border bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="mb-6">{{ logo() }}</div><h1 class="text-2xl font-semibold">Continue to MediTrack</h1><p class="mt-2 text-sm text-slate-500">Use the demo account to explore the product.</p><div class="mt-5 rounded-xl bg-brand-50 p-4 text-sm text-brand-700 dark:bg-emerald-950 dark:text-emerald-200"><p><b>Email:</b> {{ demo_email }}</p><p><b>Password:</b> {{ demo_password }}</p></div><form class="mt-6 space-y-4" method="post"><label class="field">Email<input name="email" value="{{ demo_email }}" type="email"></label><label class="field">Password<input name="password" value="{{ demo_password }}" type="password"></label><button class="btn primary w-full" type="submit">Sign in</button></form><form method="post" class="mt-3"><input type="hidden" name="demo" value="true"><button class="btn secondary w-full" onclick="showLoader()">Continue with Demo</button></form></div></div>{% endblock %}
